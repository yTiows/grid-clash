project_id = "vault"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
# Must match the linked remote project's Postgres version, or local dev
# diverges from what migrations actually run against. FOUND BY: `supabase
# gen types` against the real project (ajuxrpxpayyaxsrijuir) reporting
# postgres_engine 17, while this was still set to 15 — a leftover from
# before the project existed.
major_version = 17

[studio]
enabled = true
port = 54323

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["https://127.0.0.1:3000"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
